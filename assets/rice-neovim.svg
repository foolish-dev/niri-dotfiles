  <!-- ── source code ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
    <text x="284" y="106"><tspan fill="#617ee2" font-style="italic">use</tspan><tspan fill="#6ecfdc"> anyhow::{anyhow, Context, Result};</tspan></text>
    <text x="284" y="124"><tspan fill="#617ee2" font-style="italic">use</tspan><tspan fill="#6ecfdc"> clap::{Parser, Subcommand};</tspan></text>
    <text x="284" y="142"><tspan fill="#617ee2" font-style="italic">use</tspan><tspan fill="#6ecfdc"> std::fs;</tspan></text>
    <text x="284" y="160"><tspan fill="#617ee2" font-style="italic">use</tspan><tspan fill="#6ecfdc"> std::path::{Path, PathBuf};</tspan></text>
    <text x="284" y="178"><tspan fill="#462e97" font-style="italic">// ── install ───────────────────────────────────────</tspan></text>
    <text x="284" y="196"><tspan fill="#617ee2" font-style="italic">fn </tspan><tspan fill="#61c3cf" font-weight="700">install</tspan><tspan fill="#6ecfdc">() -&gt; </tspan><tspan fill="#4dc7c3">Result</tspan><tspan fill="#6ecfdc">&lt;()&gt; {</tspan></text>
    <text x="284" y="214"><tspan fill="#6ecfdc">    </tspan><tspan fill="#617ee2" font-style="italic">if</tspan><tspan fill="#6ecfdc"> !</tspan><tspan fill="#61c3cf">command_exists</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#778b46">"cargo"</tspan><tspan fill="#6ecfdc">) {</tspan></text>
    <text x="284" y="232"><tspan fill="#6ecfdc">        </tspan><tspan fill="#617ee2" font-style="italic">return</tspan><tspan fill="#6ecfdc"> </tspan><tspan fill="#ca6287">Err</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#61c3cf">anyhow!</tspan><tspan fill="#6ecfdc">(</tspan></text>
    <text x="284" y="250"><tspan fill="#6ecfdc">            </tspan><tspan fill="#778b46">"cargo not found — install rust first (https://rustup.rs)"</tspan></text>
    <text x="284" y="268"><tspan fill="#6ecfdc">        ));</tspan></text>
    <text x="284" y="286"><tspan fill="#6ecfdc">    }</tspan></text>
    <text x="284" y="304"><tspan fill="#6ecfdc"></tspan></text>
    <text x="284" y="322"><tspan fill="#6ecfdc">    </tspan><tspan fill="#61c3cf">setup_chaotic_aur</tspan><tspan fill="#6ecfdc">()?;</tspan></text>
    <text x="284" y="340"><tspan fill="#6ecfdc"></tspan></text>
    <text x="284" y="358"><tspan fill="#6ecfdc">    </tspan><tspan fill="#617ee2" font-style="italic">if</tspan><tspan fill="#6ecfdc"> </tspan><tspan fill="#61c3cf">command_exists</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#778b46">"grogu"</tspan><tspan fill="#6ecfdc">) {</tspan></text>
    <text x="284" y="376"><tspan fill="#6ecfdc">        </tspan><tspan fill="#61c3cf">ok</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#778b46">"grogu already installed"</tspan><tspan fill="#6ecfdc">);</tspan></text>
    <text x="284" y="394"><tspan fill="#6ecfdc">    } </tspan><tspan fill="#617ee2" font-style="italic">else</tspan><tspan fill="#6ecfdc"> {</tspan></text>
    <text x="284" y="412"><tspan fill="#6ecfdc">        </tspan><tspan fill="#61c3cf">info</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#778b46">"Installing grogu ..."</tspan><tspan fill="#6ecfdc">);</tspan></text>
    <text x="284" y="430"><tspan fill="#6ecfdc">        </tspan><tspan fill="#61c3cf">run</tspan><tspan fill="#6ecfdc">(</tspan><tspan fill="#778b46">"cargo"</tspan><tspan fill="#6ecfdc">, &amp;[</tspan><tspan fill="#778b46">"install"</tspan><tspan fill="#6ecfdc">, </tspan><tspan fill="#778b46">"--git"</tspan><tspan fill="#6ecfdc">, ...])?;</tspan></text>
    <text x="284" y="448"><tspan fill="#6ecfdc">    }</tspan></text>
    <text x="284" y="466"><tspan fill="#6ecfdc">    </tspan><tspan fill="#ca6287">Ok</tspan><tspan fill="#6ecfdc">(())</tspan></text>
  </g>

