  <line x1="30"  y1="332" x2="870" y2="332" stroke="#462e97" stroke-width="1"/>

  <!-- ── pane labels (top of each pane) ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
    <text x="42"  y="76" fill="#a77b4a">0:nvim*</text>
    <text x="462" y="76" fill="#a77b4a">1:btop</text>
    <text x="42"  y="346" fill="#a77b4a">2:zsh</text>
  </g>

  <!-- ── pane 0: nvim (top-left) ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <text x="42" y="98"><tspan fill="#462e97">  1 </tspan><tspan fill="#617ee2" font-style="italic">return</tspan><tspan fill="#6ecfdc"> {</tspan></text>
    <text x="42" y="114"><tspan fill="#462e97">  2 </tspan><tspan fill="#6ecfdc">  {</tspan></text>
    <text x="42" y="130"><tspan fill="#462e97">  3 </tspan><tspan fill="#6ecfdc">    </tspan><tspan fill="#778b46">"nvim-treesitter/nvim-treesitter"</tspan><tspan fill="#6ecfdc">,</tspan></text>
    <text x="42" y="146"><tspan fill="#462e97">  4 </tspan><tspan fill="#6ecfdc">    branch = </tspan><tspan fill="#778b46">"master"</tspan><tspan fill="#6ecfdc">,</tspan></text>
    <text x="42" y="162"><tspan fill="#462e97">  5 </tspan><tspan fill="#6ecfdc">    build = </tspan><tspan fill="#778b46">":TSUpdate"</tspan><tspan fill="#6ecfdc">,</tspan></text>
    <text x="42" y="178"><tspan fill="#462e97">  6 </tspan><tspan fill="#6ecfdc">    event = { </tspan><tspan fill="#778b46">"BufReadPost"</tspan><tspan fill="#6ecfdc">, </tspan><tspan fill="#778b46">"BufNewFile"</tspan><tspan fill="#6ecfdc"> },</tspan></text>
    <text x="42" y="194"><tspan fill="#462e97">  7 </tspan><tspan fill="#6ecfdc">    dependencies = {</tspan></text>
    <text x="42" y="210"><tspan fill="#462e97">  8 </tspan><tspan fill="#6ecfdc">      { </tspan><tspan fill="#778b46">"nvim-treesitter/textobjects"</tspan><tspan fill="#6ecfdc">,</tspan></text>
    <text x="42" y="226"><tspan fill="#462e97">  9 </tspan><tspan fill="#6ecfdc">        branch = </tspan><tspan fill="#778b46">"master"</tspan><tspan fill="#6ecfdc"> },</tspan></text>
    <text x="42" y="242"><tspan fill="#462e97"> 10 </tspan><tspan fill="#6ecfdc">    },</tspan></text>
    <text x="42" y="258"><tspan fill="#462e97"> 11 </tspan><tspan fill="#6ecfdc">    opts = {</tspan></text>
    <text x="42" y="274"><tspan fill="#462e97"> 12 </tspan><tspan fill="#6ecfdc">      ensure_installed = { </tspan><tspan fill="#778b46">"rust"</tspan><tspan fill="#6ecfdc">, </tspan><tspan fill="#778b46">"lua"</tspan><tspan fill="#6ecfdc">,</tspan></text>
    <text x="42" y="290"><tspan fill="#462e97"> 13 </tspan><tspan fill="#6ecfdc">        </tspan><tspan fill="#778b46">"python"</tspan><tspan fill="#6ecfdc">, </tspan><tspan fill="#778b46">"bash"</tspan><tspan fill="#6ecfdc">, </tspan><tspan fill="#778b46">"go"</tspan><tspan fill="#6ecfdc"> },</tspan></text>
    <text x="42" y="306"><tspan fill="#462e97"> 14 </tspan><tspan fill="#6ecfdc">      highlight = { enable = </tspan><tspan fill="#ca6287">true</tspan><tspan fill="#6ecfdc"> },</tspan></text>
  </g>
