<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="tmux rice — three panes (editor, monitor, log) under the Grogu palette with a powerline status bar">
  <rect width="900" height="540" fill="#080724"/>
  <rect x="30" y="24" width="840" height="492" fill="#0e112b" stroke="#462e97" stroke-width="1" rx="6" ry="6"/>

