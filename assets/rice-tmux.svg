  <polygon points="110,494 122,505 110,516" fill="#617ee2"/>

  <text x="138" y="509" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#778b46" font-weight="700">0:nvim*</text>
  <text x="200" y="509" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6ecfdc">1:btop</text>
