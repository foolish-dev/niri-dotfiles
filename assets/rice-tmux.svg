    <text x="462" y="114"><tspan fill="#6ecfdc">  0 </tspan><tspan fill="#778b46">████████</tspan><tspan fill="#a77b4a">██</tspan><tspan fill="#462e97">··········</tspan><tspan fill="#6ecfdc"> 48%</tspan></text>
    <text x="462" y="128"><tspan fill="#6ecfdc">  1 </tspan><tspan fill="#778b46">██████</tspan><tspan fill="#462e97">··············</tspan><tspan fill="#6ecfdc"> 31%</tspan></text>
    <text x="462" y="142"><tspan fill="#6ecfdc">  2 </tspan><tspan fill="#778b46">█████████</tspan><tspan fill="#a77b4a">███</tspan><tspan fill="#462e97">········</tspan><tspan fill="#6ecfdc"> 62%</tspan></text>
    <text x="462" y="156"><tspan fill="#6ecfdc">  3 </tspan><tspan fill="#778b46">████</tspan><tspan fill="#462e97">················</tspan><tspan fill="#6ecfdc"> 22%</tspan></text>
    <text x="462" y="178" fill="#a77b4a">mem  ─────────────────────────</text>
    <text x="462" y="194"><tspan fill="#6ecfdc">used </tspan><tspan fill="#4dc7c3">██████████</tspan><tspan fill="#462e97">··········</tspan><tspan fill="#6ecfdc"> 12.4 GiB</tspan></text>
    <text x="462" y="208"><tspan fill="#6ecfdc">free </tspan><tspan fill="#61c3cf">████████</tspan><tspan fill="#462e97">············</tspan><tspan fill="#6ecfdc">  3.6 GiB</tspan></text>
    <text x="462" y="230" fill="#a77b4a">net  ─────────────────────────</text>
    <text x="462" y="246"><tspan fill="#6ecfdc">↓ </tspan><tspan fill="#617ee2">     1.2 MB/s</tspan></text>
    <text x="462" y="260"><tspan fill="#6ecfdc">↑ </tspan><tspan fill="#ca6287">     0.3 MB/s</tspan></text>
    <text x="462" y="282" fill="#a77b4a">proc ─────────────────────────</text>
    <text x="462" y="298"><tspan fill="#462e97">  PID  CMD          CPU  MEM </tspan></text>
    <text x="462" y="312"><tspan fill="#6ecfdc"> 4188  nvim         </tspan><tspan fill="#778b46">14.2</tspan><tspan fill="#6ecfdc">  </tspan><tspan fill="#778b46">3.1</tspan></text>
    <text x="462" y="326"><tspan fill="#6ecfdc">  812  hexstrike    </tspan><tspan fill="#778b46"> 6.4</tspan><tspan fill="#6ecfdc">  </tspan><tspan fill="#778b46">2.8</tspan></text>
  </g>

  <!-- ── pane 2: zsh log (bottom) ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <text x="42" y="368"><tspan fill="#778b46">fool@arch</tspan><tspan fill="#6ecfdc"> </tspan><tspan fill="#61c3cf">~/dotfiles</tspan><tspan fill="#ca6287"> ❯</tspan><tspan fill="#6ecfdc"> cargo build --release</tspan></text>
    <text x="42" y="384"><tspan fill="#778b46">   Compiling</tspan><tspan fill="#6ecfdc"> proc-macro2 v1.0.105</tspan></text>
    <text x="42" y="400"><tspan fill="#778b46">   Compiling</tspan><tspan fill="#6ecfdc"> serde v1.0.224</tspan></text>
    <text x="42" y="416"><tspan fill="#778b46">   Compiling</tspan><tspan fill="#6ecfdc"> clap_builder v4.6.0</tspan></text>
    <text x="42" y="432"><tspan fill="#778b46">   Compiling</tspan><tspan fill="#6ecfdc"> dotctl v0.1.0 (/home/fool/dotfiles)</tspan></text>
    <text x="42" y="448"><tspan fill="#778b46">    Finished</tspan><tspan fill="#6ecfdc"> `release` profile [optimized] target(s) in 14.71s</tspan></text>
    <text x="42" y="468"><tspan fill="#778b46">fool@arch</tspan><tspan fill="#6ecfdc"> </tspan><tspan fill="#61c3cf">~/dotfiles</tspan><tspan fill="#ca6287"> ❯</tspan><tspan fill="#6ecfdc"> ./target/release/dotctl deploy</tspan></text>
    <text x="42" y="484"><tspan fill="#61c3cf">[*]</tspan><tspan fill="#6ecfdc"> === Deploying from /home/fool/dotfiles ===</tspan></text>
