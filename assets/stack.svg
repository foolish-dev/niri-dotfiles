<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="sacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="100%" style="stop-color:#bb9af7"/>
    </linearGradient>
    <filter id="scard">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="sglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#414868" stroke-width="0.3" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="420" rx="12" fill="url(#sbg)"/>
  <rect width="900" height="420" rx="12" fill="url(#sgrid)"/>

  <text x="450" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#565f89" letter-spacing="6">ARCHITECTURE</text>

  <!-- Row 1: Agents -->
  <text x="50" y="68" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">AGENT</text>

  <!-- Telia card -->
  <g filter="url(#scard)">
    <rect x="50" y="80" width="380" height="90" rx="10" fill="#1a1b26" stroke="#bb9af7" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 108)">
    <rect x="0" y="0" width="36" height="28" rx="3" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
    <path d="M5,8 L11,13 L5,18" fill="none" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="15" y1="18" x2="28" y2="18" stroke="#7dcfff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="125" y="115" font-family="'JetBrains Mono',monospace" font-size="14" fill="#c0caf5" font-weight="600">Telia</text>
  <text x="125" y="133" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">TUI coding agent · Rust · MCP-aware</text>
  <text x="125" y="148" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">.config/telia/config.toml — 10 MCP servers wired</text>

  <!-- Server count badge -->
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="340" y="120" width="76" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="378" y="136" text-anchor="middle" fill="#7dcfff">10 MCPs</text>
  </g>

  <!-- Connection -->
  <line x1="240" y1="170" x2="240" y2="200" stroke="#414868" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Row 2: MCP backend -->
  <text x="50" y="195" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">MCP BACKEND</text>

  <g filter="url(#scard)">
    <rect x="50" y="207" width="380" height="68" rx="10" fill="#1a1b26" stroke="#f7768e" stroke-width="1" stroke-opacity="0.6"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 226)">
    <path d="M14,0 L0,7 L0,16 Q0,28 14,32 Q28,28 28,16 L28,7 Z" fill="none" stroke="#f7768e" stroke-width="1.5"/>
    <path d="M9,15 L12,18 L19,11" fill="none" stroke="#f7768e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="234" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">HexStrike AI</text>
  <text x="120" y="252" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">Flask :8888 (loopback, IPAddressDeny=any)</text>
  <text x="120" y="265" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">systemd user unit · ~/.local/bin/hexstrike-mcp bridge</text>

  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="340" y="221" width="76" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="378" y="237" text-anchor="middle" fill="#f7768e">150+ tools</text>
  </g>

  <!-- Right column: Theming + Editor + Shell + Banner -->

  <!-- Grogu -->
  <text x="475" y="68" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">THEMING</text>
  <g filter="url(#scard)">
    <rect x="475" y="80" width="380" height="60" rx="10" fill="#1a1b26" stroke="#7dcfff" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(496, 100)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="6" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.7"/>
    <circle cx="12" cy="12" r="3" fill="#bb9af7" opacity="0.6"/>
  </g>
  <text x="540" y="108" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">grogu</text>
  <text x="540" y="126" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">wallpaper → palette → repaint 7 targets in one shot</text>

  <!-- Neovim -->
  <text x="475" y="160" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">EDITOR</text>
  <g filter="url(#scard)">
    <rect x="475" y="172" width="380" height="60" rx="10" fill="#1a1b26" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(496, 192)">
    <rect x="0" y="0" width="24" height="22" rx="3" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
    <polygon points="5,18 5,4 11,13 19,4 19,18" fill="none" stroke="#9ece6a" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="540" y="200" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">Neovim</text>
  <text x="540" y="218" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">lazy.nvim · Mason · Tokyo Night · LSP · AI</text>

  <!-- Noctalia -->
  <text x="475" y="252" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">SHELL</text>
  <g filter="url(#scard)">
    <rect x="475" y="264" width="380" height="60" rx="10" fill="#1a1b26" stroke="#c0caf5" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <g filter="url(#sglow)" transform="translate(496, 286)">
    <rect x="0" y="0" width="22" height="3" rx="1.5" fill="#c0caf5"/>
    <circle cx="11" cy="15" r="7" fill="none" stroke="#c0caf5" stroke-width="1.5"/>
  </g>
  <text x="540" y="292" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">Noctalia</text>
  <text x="540" y="310" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">Quickshell · bar · dock · panels · launcher · lock</text>

  <!-- Fastfetch (bottom span across whole row) -->
  <text x="50" y="312" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">BANNER</text>
  <g filter="url(#scard)">
    <rect x="50" y="324" width="380" height="50" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 340)">
    <rect x="0" y="0" width="22" height="18" rx="2" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <rect x="3" y="3" width="6" height="2" fill="#7aa2f7" opacity="0.6"/>
    <rect x="3" y="7" width="10" height="2" fill="#bb9af7" opacity="0.5"/>
    <rect x="3" y="11" width="8" height="2" fill="#7dcfff" opacity="0.5"/>
  </g>
  <text x="120" y="348" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">fastfetch</text>
  <text x="120" y="365" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">terminal banner · Tokyo Night `config.jsonc`</text>

  <!-- Foundation -->
  <rect x="475" y="345" width="380" height="44" rx="10" fill="none" stroke="#414868" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="490" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#565f89" letter-spacing="1">Foundation:</text>
  <text x="580" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7aa2f7" font-weight="600">Arch Linux</text>
  <text x="670" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#414868">+</text>
  <text x="690" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#e0af68" font-weight="600">systemd</text>
  <text x="757" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#414868">+</text>
  <text x="775" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#bb9af7" font-weight="600">cargo</text>
  <text x="525" y="382" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#565f89"></text>

  <!-- Decorative bottom orbs -->
  <circle cx="820" cy="402" r="3" fill="#7aa2f7" opacity="0.7"/>
  <circle cx="835" cy="402" r="3" fill="#bb9af7" opacity="0.7"/>
  <circle cx="850" cy="402" r="3" fill="#7dcfff" opacity="0.7"/>
</svg>
