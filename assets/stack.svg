<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <filter id="scard">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="sglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#414868" stroke-width="0.3" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="540" rx="12" fill="url(#sbg)"/>
  <rect width="900" height="540" rx="12" fill="url(#sgrid)"/>

  <text x="450" y="30" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#565f89" letter-spacing="6">ARCHITECTURE</text>

  <!-- Row 0: INSTALLER (full width) -->
  <text x="50" y="60" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">INSTALLER</text>
  <g filter="url(#scard)">
    <rect x="50" y="72" width="800" height="64" rx="10" fill="#1a1b26" stroke="#e0af68" stroke-width="1" stroke-opacity="0.55"/>
  </g>
  <g filter="url(#sglow)" transform="translate(74, 92)">
    <circle cx="14" cy="14" r="12" fill="none" stroke="#e0af68" stroke-width="1.5"/>
    <g stroke="#e0af68" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
      <line x1="14" y1="0"  x2="14" y2="3"/>
      <line x1="14" y1="25" x2="14" y2="28"/>
      <line x1="0"  y1="14" x2="3"  y2="14"/>
      <line x1="25" y1="14" x2="28" y2="14"/>
    </g>
    <path d="M10,10 L17,14 L10,18" fill="none" stroke="#bb9af7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="100" font-family="'JetBrains Mono',monospace" font-size="14" fill="#c0caf5" font-weight="600">dotctl</text>
  <text x="120" y="120" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">Rust binary · install + deploy + all · wires Chaotic AUR, cargo, pacman, symlinks, systemd</text>
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="700" y="90" width="68" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="734" y="106" text-anchor="middle" fill="#e0af68">install</text>
    <rect x="776" y="90" width="62" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="807" y="106" text-anchor="middle" fill="#bb9af7">deploy</text>
  </g>

  <!-- Connector down -->
  <line x1="450" y1="136" x2="450" y2="156" stroke="#414868" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Row 1: AGENT (Telia) + THEMING (grogu) -->
  <text x="50"  y="166" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">AGENT</text>
  <g filter="url(#scard)">
    <rect x="50" y="178" width="395" height="72" rx="10" fill="#1a1b26" stroke="#bb9af7" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 198)">
    <rect x="0" y="0" width="32" height="26" rx="3" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
    <text x="16" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#bb9af7" font-weight="700">&gt;_</text>
  </g>
  <text x="120" y="204" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">Telia</text>
  <text x="120" y="222" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">TUI coding agent · Rust · MCP-aware</text>
  <text x="120" y="236" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">.config/telia/config.toml — 10 MCP servers</text>
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="368" y="200" width="64" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="400" y="216" text-anchor="middle" fill="#7dcfff">10 MCPs</text>
  </g>

  <text x="465" y="166" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">THEMING</text>
  <g filter="url(#scard)">
    <rect x="465" y="178" width="385" height="72" rx="10" fill="#1a1b26" stroke="#7dcfff" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(486, 200)">
    <circle cx="14" cy="14" r="13" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="7"  fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.7"/>
    <circle cx="14" cy="14" r="3"  fill="#e0af68" opacity="0.85"/>
  </g>
  <text x="530" y="204" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">grogu</text>
  <text x="530" y="222" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">wallpaper → palette → repaint, Rust</text>
  <text x="530" y="236" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">writes niri, kitty, tmux, nvim, ghostty, telia, noctalia</text>
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="772" y="200" width="68" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="806" y="216" text-anchor="middle" fill="#bb9af7">7 targets</text>
  </g>

  <!-- Row 2: MCP BACKEND (HexStrike) + EDITOR (Neovim) -->
  <text x="50"  y="276" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">MCP BACKEND</text>
  <g filter="url(#scard)">
    <rect x="50" y="288" width="395" height="72" rx="10" fill="#1a1b26" stroke="#f7768e" stroke-width="1" stroke-opacity="0.6"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 308)">
    <path d="M14,0 L0,7 L0,16 Q0,28 14,32 Q28,28 28,16 L28,7 Z" fill="none" stroke="#f7768e" stroke-width="1.5"/>
    <path d="M9,15 L12,18 L19,11" fill="none" stroke="#9ece6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="314" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">HexStrike AI</text>
  <text x="120" y="332" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">Flask :8888 — loopback only (IPAddressDeny=any)</text>
  <text x="120" y="346" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">systemd user unit · ~/.local/bin/hexstrike-mcp stdio bridge</text>
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="364" y="310" width="68" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="398" y="326" text-anchor="middle" fill="#f7768e">150+ tools</text>
  </g>

  <text x="465" y="276" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">EDITOR</text>
  <g filter="url(#scard)">
    <rect x="465" y="288" width="385" height="72" rx="10" fill="#1a1b26" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(486, 308)">
    <rect x="0" y="0" width="26" height="24" rx="3" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
    <polygon points="5,20 5,4 12,14 21,4 21,20" fill="none" stroke="#9ece6a" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="530" y="314" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">Neovim</text>
  <text x="530" y="332" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">lazy.nvim · Mason · Tokyo Night · LSP · AI</text>
  <text x="530" y="346" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">init.lua + lua/{config,plugins}/* (13 tracked files)</text>

  <!-- Row 3: MULTIPLEXER (tmux) + SHELL (Noctalia) -->
  <text x="50"  y="386" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">MULTIPLEXER</text>
  <g filter="url(#scard)">
    <rect x="50" y="398" width="395" height="72" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#sglow)" transform="translate(72, 418)">
    <rect x="0" y="0" width="32" height="28" rx="3" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <line x1="16" y1="4" x2="16" y2="20" stroke="#7aa2f7" stroke-width="1" opacity="0.6"/>
    <rect x="3"  y="6"  width="10" height="2" rx="1" fill="#bb9af7" opacity="0.55"/>
    <rect x="19" y="6"  width="10" height="2" rx="1" fill="#7dcfff" opacity="0.55"/>
    <rect x="2"  y="22" width="28" height="4" rx="1.5" fill="#9ece6a" opacity="0.35"/>
  </g>
  <text x="120" y="424" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">tmux</text>
  <text x="120" y="442" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">prefix C-a · powerline + transparent fills</text>
  <text x="120" y="456" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">tmux.conf + scripts/mem.sh RAM bar fragment</text>

  <text x="465" y="386" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">SHELL</text>
  <g filter="url(#scard)">
    <rect x="465" y="398" width="385" height="72" rx="10" fill="#1a1b26" stroke="#c0caf5" stroke-width="1" stroke-opacity="0.45"/>
  </g>
  <g filter="url(#sglow)" transform="translate(486, 422)">
    <rect x="0"  y="0" width="26" height="3" rx="1.5" fill="#c0caf5"/>
    <circle cx="13" cy="14" r="8" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
    <path d="M17,10 Q14,14 17,18" fill="none" stroke="#bb9af7" stroke-width="1.3"/>
  </g>
  <text x="530" y="424" font-family="'JetBrains Mono',monospace" font-size="13" fill="#c0caf5" font-weight="600">Noctalia</text>
  <text x="530" y="442" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">Quickshell · bar · dock · panels · launcher · lock</text>
  <text x="530" y="456" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">transparency-blur bar (opacity 0.2 + enableBlurBehind)</text>

  <!-- Row 4: BANNER (fastfetch, full width slim) -->
  <text x="50"  y="486" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89" letter-spacing="3">BANNER</text>
  <g filter="url(#scard)">
    <rect x="50" y="498" width="395" height="32" rx="8" fill="#1a1b26" stroke="#7dcfff" stroke-width="1" stroke-opacity="0.45"/>
  </g>
  <g filter="url(#sglow)" transform="translate(64, 506)">
    <rect x="0" y="0" width="16" height="14" rx="2" fill="none" stroke="#7dcfff" stroke-width="1.4"/>
    <rect x="2" y="3" width="6" height="1.5" fill="#7aa2f7" opacity="0.7"/>
    <rect x="2" y="6" width="9" height="1.5" fill="#bb9af7" opacity="0.6"/>
    <rect x="2" y="9" width="7" height="1.5" fill="#9ece6a" opacity="0.6"/>
  </g>
  <text x="90"  y="518" font-family="'JetBrains Mono',monospace" font-size="11" fill="#c0caf5" font-weight="600">fastfetch</text>
  <text x="170" y="518" font-family="'JetBrains Mono',monospace" font-size="9" fill="#565f89">terminal banner · Tokyo Night config.jsonc</text>

  <!-- Foundation strip -->
  <rect x="465" y="498" width="385" height="32" rx="8" fill="none" stroke="#414868" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565f89">Foundation:</text>
  <text x="560" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#7aa2f7" font-weight="600">Arch</text>
  <text x="592" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#414868">+</text>
  <text x="602" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#f7768e" font-weight="600">Chaotic AUR</text>
  <text x="678" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#414868">+</text>
  <text x="688" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#e0af68" font-weight="600">systemd</text>
  <text x="742" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#414868">+</text>
  <text x="752" y="518" font-family="'JetBrains Mono',monospace" font-size="10" fill="#bb9af7" font-weight="600">cargo</text>
</svg>
