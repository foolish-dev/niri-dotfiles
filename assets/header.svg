<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="50%" style="stop-color:#bb9af7"/>
      <stop offset="100%" style="stop-color:#7dcfff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#bb9af7;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7dcfff;stop-opacity:0"/>
    </linearGradient>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#414868" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="900" height="280" rx="12" fill="url(#bg)"/>
  <rect width="900" height="280" rx="12" fill="url(#grid)"/>
  <ellipse cx="450" cy="120" rx="380" ry="80" fill="url(#glow)"/>

  <!-- Top decorative line + traffic-light orbs -->
  <rect x="100" y="38" width="700" height="1.5" rx="1" fill="url(#accent)" opacity="0.6"/>
  <circle cx="120" cy="38" r="3" fill="#f7768e" opacity="0.8"/>
  <circle cx="135" cy="38" r="3" fill="#e0af68" opacity="0.8"/>
  <circle cx="150" cy="38" r="3" fill="#9ece6a" opacity="0.8"/>

  <!-- Folder icon left -->
  <g transform="translate(155, 92)" opacity="0.55">
    <path d="M0,6 L0,32 Q0,36 4,36 L34,36 Q38,36 38,32 L38,12 Q38,8 34,8 L18,8 L14,4 L4,4 Q0,4 0,8 Z" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <line x1="6" y1="18" x2="32" y2="18" stroke="#bb9af7" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="24" x2="32" y2="24" stroke="#bb9af7" stroke-width="1" opacity="0.4"/>
    <line x1="6" y1="30" x2="22" y2="30" stroke="#bb9af7" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Terminal arrow right -->
  <g transform="translate(715, 95)" opacity="0.55">
    <rect x="0" y="0" width="32" height="24" rx="3" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <path d="M7,8 L13,13 L7,18" fill="none" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="16" y1="18" x2="24" y2="18" stroke="#7dcfff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="450" y="135" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="62" font-weight="800" letter-spacing="12" fill="url(#accent)" filter="url(#textglow)">DOTFILES</text>

  <!-- Subtitle divider -->
  <rect x="220" y="160" width="460" height="1" rx="0.5" fill="url(#accent)" opacity="0.3"/>

  <!-- Subtitle -->
  <text x="450" y="188" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#565f89" letter-spacing="3">MINIMAL CORE  ·  AI AGENT MCP  ·  WALLPAPER-DRIVEN THEMING</text>

  <!-- Component tags -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" filter="url(#softglow)">
    <text x="135" y="225" text-anchor="middle" fill="#bb9af7" opacity="0.85">TELIA</text>
    <text x="178" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="216" y="225" text-anchor="middle" fill="#7dcfff" opacity="0.85">GROGU</text>
    <text x="266" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="320" y="225" text-anchor="middle" fill="#f7768e" opacity="0.85">HEXSTRIKE</text>
    <text x="385" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="430" y="225" text-anchor="middle" fill="#9ece6a" opacity="0.85">NEOVIM</text>
    <text x="478" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="528" y="225" text-anchor="middle" fill="#7aa2f7" opacity="0.85">TMUX</text>
    <text x="568" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="618" y="225" text-anchor="middle" fill="#c0caf5" opacity="0.85">NOCTALIA</text>
    <text x="678" y="225" text-anchor="middle" fill="#414868">·</text>
    <text x="730" y="225" text-anchor="middle" fill="#7dcfff" opacity="0.85">FASTFETCH</text>
  </g>

  <!-- Bottom line + orbs -->
  <rect x="100" y="246" width="700" height="1.5" rx="1" fill="url(#accent)" opacity="0.6"/>
  <circle cx="750" cy="246" r="3" fill="#7aa2f7" opacity="0.8"/>
  <circle cx="765" cy="246" r="3" fill="#bb9af7" opacity="0.8"/>
  <circle cx="780" cy="246" r="3" fill="#7dcfff" opacity="0.8"/>
</svg>
