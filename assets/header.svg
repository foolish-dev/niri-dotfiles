<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="dotfiles — AI coding agent, wallpaper-driven theming, offensive-security MCP, editor, multiplexer, shell, banner — one Rust binary">
  <rect width="900" height="200" fill="#0e112b"/>
  <rect x="0" y="0" width="900" height="3" fill="#61c3cf"/>
  <rect x="0" y="197" width="900" height="3" fill="#462e97"/>
  <rect x="40" y="42" width="3" height="116" fill="#a77b4a"/>

  <text x="58" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="58" font-weight="700" fill="#6ecfdc">dotfiles</text>
  <text x="60" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#778b46">// AI coding agent · wallpaper-driven theming · offensive-security MCP backend</text>
  <text x="60" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#778b46">// editor · multiplexer · shell · banner — one Rust binary</text>

  <text x="845" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#462e97" text-anchor="end">⟨ 0x000 ⟩</text>
  <rect x="848" y="33" width="5" height="11" fill="#61c3cf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Sliding scan-line across the top stripe -->
  <rect x="-80" y="0" width="80" height="3" fill="#ffffff" opacity="0.7">
    <animate attributeName="x" values="-80;900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Palette dot wave (purple → cyan), staggered pulse -->
  <g fill="#462e97">
    <rect x="760" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0s"   repeatCount="indefinite"/></rect>
    <rect x="772" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="784" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="796" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="808" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="820" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="1.0s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#61c3cf">
    <rect x="832" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="844" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="856" y="160" width="6" height="6" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></rect>
  </g>
</svg>
