<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="hacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7768e"/>
      <stop offset="100%" style="stop-color:#e0af68"/>
    </linearGradient>
    <filter id="hglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#414868" stroke-width="0.2" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="900" height="100" rx="10" fill="url(#hbg)"/>
  <rect width="900" height="100" rx="10" fill="url(#hgrid)"/>
  <rect x="60" y="14" width="780" height="1" rx="0.5" fill="url(#hacc)" opacity="0.55"/>

  <!-- Shield + check icon -->
  <g transform="translate(75, 30)" filter="url(#hglow)">
    <path d="M16,0 L0,8 L0,22 Q0,34 16,40 Q32,34 32,22 L32,8 Z" fill="none" stroke="#f7768e" stroke-width="1.5"/>
    <path d="M10,20 L14,24 L23,15" fill="none" stroke="#9ece6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="130" y="52" font-family="'JetBrains Mono','Fira Code',monospace" font-size="22" font-weight="700" fill="#c0caf5" filter="url(#hglow)">HexStrike AI</text>
  <text x="130" y="71" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#565f89" letter-spacing="2">MCP BACKEND  ·  150+ OFFENSIVE-SEC TOOLS  ·  LOOPBACK :8888</text>

  <!-- Service tag badges -->
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="528" y="35" width="60" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="558" y="51" text-anchor="middle" fill="#7aa2f7">Flask</text>
    <rect x="596" y="35" width="68" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="630" y="51" text-anchor="middle" fill="#e0af68">systemd</text>
    <rect x="672" y="35" width="76" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="710" y="51" text-anchor="middle" fill="#9ece6a">sandboxed</text>
    <rect x="756" y="35" width="56" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="784" y="51" text-anchor="middle" fill="#bb9af7">stdio</text>
  </g>

  <rect x="60" y="85" width="780" height="1" rx="0.5" fill="url(#hacc)" opacity="0.55"/>
  <circle cx="840" cy="85" r="2.5" fill="#f7768e" opacity="0.8"/>
  <circle cx="851" cy="85" r="2.5" fill="#e0af68" opacity="0.8"/>
</svg>
