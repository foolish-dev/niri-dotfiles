<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="Noctalia bar rice — workspace pills, focused window, tray icons under the Grogu palette">
  <!-- desktop bg with subtle blur tint -->
  <rect width="900" height="60" fill="#080724"/>

  <!-- bar (transparency-blur effect simulated with alpha) -->
  <rect x="10" y="10" width="880" height="40" fill="#0e112b" opacity="0.85" rx="8" ry="8"/>
  <rect x="10" y="10" width="880" height="40" fill="none" stroke="#462e97" stroke-width="1" rx="8" ry="8"/>

  <!-- ── workspace pills (left) ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">
    <rect x="28"  y="22" width="24" height="16" rx="4" ry="4" fill="#617ee2"/>
    <text x="40"  y="34" fill="#0e112b" text-anchor="middle">1</text>

    <rect x="58"  y="22" width="24" height="16" rx="4" ry="4" fill="#272658" stroke="#61c3cf" stroke-width="1"/>
    <text x="70"  y="34" fill="#61c3cf" text-anchor="middle">2</text>

    <rect x="88"  y="22" width="24" height="16" rx="4" ry="4" fill="#272658" stroke="#462e97" stroke-width="1"/>
    <text x="100" y="34" fill="#462e97" text-anchor="middle">3</text>

    <rect x="118" y="22" width="24" height="16" rx="4" ry="4" fill="#272658" stroke="#462e97" stroke-width="1"/>
    <text x="130" y="34" fill="#462e97" text-anchor="middle">4</text>

    <rect x="148" y="22" width="24" height="16" rx="4" ry="4" fill="#272658" stroke="#462e97" stroke-width="1"/>
    <text x="160" y="34" fill="#462e97" text-anchor="middle">5</text>
  </g>

  <!-- pulse on the focused workspace -->
  <rect x="28" y="22" width="24" height="16" rx="4" ry="4" fill="#617ee2" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- ── center: focused window / app ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
    <text x="450" y="34" fill="#6ecfdc" text-anchor="middle"><tspan fill="#a77b4a">●</tspan>  nvim · src/main.rs</text>
  </g>

  <!-- ── tray (right) ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <!-- CPU -->
    <text x="612" y="34" fill="#778b46" font-weight="700">cpu</text>
    <rect x="638" y="26" width="38" height="8" fill="#272658" rx="2" ry="2"/>
    <rect x="638" y="26" width="18" height="8" fill="#778b46" rx="2" ry="2">
      <animate attributeName="width" values="14;22;18;26;18;14" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- MEM -->
    <text x="688" y="34" fill="#4dc7c3" font-weight="700">mem</text>
    <rect x="716" y="26" width="38" height="8" fill="#272658" rx="2" ry="2"/>
    <rect x="716" y="26" width="30" height="8" fill="#4dc7c3" rx="2" ry="2"/>

    <!-- net -->
    <text x="772" y="34" fill="#61c3cf">↓1.2</text>

    <!-- vol -->
    <text x="810" y="34" fill="#a77b4a">vol 64</text>

    <!-- clock + date -->
    <text x="872" y="34" fill="#6ecfdc" font-weight="700" text-anchor="end">22:43</text>
  </g>
</svg>
