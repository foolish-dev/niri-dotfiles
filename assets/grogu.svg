<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100">
  <defs>
    <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7dcfff"/>
      <stop offset="50%" style="stop-color:#bb9af7"/>
      <stop offset="100%" style="stop-color:#e0af68"/>
    </linearGradient>
    <filter id="gglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ggrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#414868" stroke-width="0.2" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="900" height="100" rx="10" fill="url(#gbg)"/>
  <rect width="900" height="100" rx="10" fill="url(#ggrid)"/>
  <rect x="60" y="14" width="780" height="1" rx="0.5" fill="url(#gacc)" opacity="0.5"/>

  <!-- Concentric circles palette icon -->
  <g transform="translate(90, 50)" filter="url(#gglow)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="7"  fill="#e0af68" opacity="0.8"/>
  </g>

  <text x="130" y="52" font-family="'JetBrains Mono','Fira Code',monospace" font-size="22" font-weight="700" fill="#c0caf5" filter="url(#gglow)">grogu</text>
  <text x="130" y="71" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#565f89" letter-spacing="2">WALLPAPER  →  PALETTE  →  REPAINT  ·  RUST</text>

  <!-- Target badges -->
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="488" y="35" width="60" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="518" y="51" text-anchor="middle" fill="#bb9af7">niri</text>
    <rect x="556" y="35" width="60" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="586" y="51" text-anchor="middle" fill="#7dcfff">kitty</text>
    <rect x="624" y="35" width="64" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="656" y="51" text-anchor="middle" fill="#9ece6a">nvim</text>
    <rect x="696" y="35" width="56" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="724" y="51" text-anchor="middle" fill="#7aa2f7">tmux</text>
    <rect x="760" y="35" width="52" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="786" y="51" text-anchor="middle" fill="#e0af68">+3</text>
  </g>

  <rect x="60" y="85" width="780" height="1" rx="0.5" fill="url(#gacc)" opacity="0.5"/>
  <circle cx="840" cy="85" r="2.5" fill="#7dcfff" opacity="0.7"/>
  <circle cx="851" cy="85" r="2.5" fill="#bb9af7" opacity="0.7"/>
</svg>
