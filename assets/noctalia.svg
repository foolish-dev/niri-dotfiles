<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100">
  <defs>
    <linearGradient id="ocbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <linearGradient id="ocacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0caf5"/>
      <stop offset="100%" style="stop-color:#bb9af7"/>
    </linearGradient>
    <filter id="ocglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ocgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#414868" stroke-width="0.2" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="900" height="100" rx="10" fill="url(#ocbg)"/>
  <rect width="900" height="100" rx="10" fill="url(#ocgrid)"/>
  <rect x="60" y="14" width="780" height="1" rx="0.5" fill="url(#ocacc)" opacity="0.5"/>

  <!-- Stylized bar + dock + moon icon -->
  <g transform="translate(68, 32)" filter="url(#ocglow)">
    <rect x="0" y="0" width="44" height="4" rx="2" fill="#c0caf5" opacity="0.85"/>
    <rect x="6" y="32" width="32" height="4" rx="2" fill="#c0caf5" opacity="0.6"/>
    <circle cx="22" cy="20" r="9" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
    <path d="M28,16 Q24,20 28,24" fill="none" stroke="#bb9af7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <text x="130" y="52" font-family="'JetBrains Mono','Fira Code',monospace" font-size="22" font-weight="700" fill="#c0caf5" filter="url(#ocglow)">Noctalia</text>
  <text x="130" y="71" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#565f89" letter-spacing="2">QUICKSHELL · BAR · DOCK · PANELS · LAUNCHER · LOCK</text>

  <!-- Module badges -->
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <rect x="510" y="35" width="56" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="538" y="51" text-anchor="middle" fill="#bb9af7">picker</text>
    <rect x="574" y="35" width="76" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="612" y="51" text-anchor="middle" fill="#7dcfff">colorscheme</text>
    <rect x="658" y="35" width="68" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="692" y="51" text-anchor="middle" fill="#9ece6a">plugins</text>
    <rect x="734" y="35" width="76" height="22" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="772" y="51" text-anchor="middle" fill="#e0af68">SDDM sync</text>
  </g>

  <rect x="60" y="85" width="780" height="1" rx="0.5" fill="url(#ocacc)" opacity="0.5"/>
  <circle cx="840" cy="85" r="2.5" fill="#c0caf5" opacity="0.7"/>
  <circle cx="851" cy="85" r="2.5" fill="#bb9af7" opacity="0.7"/>
</svg>
