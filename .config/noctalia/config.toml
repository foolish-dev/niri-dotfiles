# Noctalia v5 config, tracked. v5 merges every *.toml in this directory, in
# alphabetical order; what its Settings window changes is saved to
# ~/.local/state/noctalia/settings.toml and wins over all of them.

[theme]
# The palette grogu makes from each wallpaper. v5 reads custom palettes from
# palettes/<name>.json; grogu writes palettes/Grogu.json, gitignored like the
# rest of grogu's output. Until grogu first runs, v5 shows its built-in
# palette -- the `started` hook below keeps that to one start.
source         = "custom"
custom_palette = "Grogu"

[shell]
# The tracked avatar, through avatar.jpg here, a link to assets/avatar.jpg, so
# the path holds wherever the repo is cloned. Unset, v5 looks for ~/.face,
# which nothing here creates.
avatar_path = "~/.config/noctalia/avatar.jpg"

[wallpaper]
# The curated set `dotctl deploy` copies. Left empty, v5 would browse all of
# ~/Pictures.
directory = "~/Pictures/Wallpapers"

[backdrop]
# v4's blurred overview wallpaper, at v4's strengths. niri's layer rule for
# noctalia-backdrop puts it behind the workspaces in the overview.
enabled        = true
blur_intensity = 0.7
tint_intensity = 0.5

# Lock behind a blurred capture of the desktop instead of the wallpaper.
[lockscreen]
blurred_desktop = true

[bar.default]
# v4's bar: see-through over the compositor blur (on by default), widgets in
# capsules, and v4's widget layout. v4's one SystemMonitor showed CPU usage,
# CPU temperature and memory; v5 has a widget per statistic.
background_opacity = 0.2
capsule            = true
capsule_opacity    = 0.85
start  = ["launcher", "clock", "cpu", "temp", "ram", "media"]
center = ["workspaces"]
end    = ["tray", "notifications", "battery", "volume", "brightness", "control-center"]

[hooks]
# Repaint the desktop from each new wallpaper: grogu (0.2+, which `dotctl
# install` ensures) rewrites the palette and has this shell reload it, and
# --reload repaints running kitty, tmux and teleia.
wallpaper_changed = '"$HOME/.cargo/bin/grogu" apply --extract="$NOCTALIA_WALLPAPER_PATH" --reload'
# A fresh clone has no palette until that first runs, so make one from the
# wallpaper on screen; --extract with no path asks this shell for it.
started = '[ -e "$HOME/.config/noctalia/palettes/Grogu.json" ] || "$HOME/.cargo/bin/grogu" apply --extract --reload'
