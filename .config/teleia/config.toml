# teleia config — MCP servers mirrored from ~/.config/opencode/opencode.json.
# Deployed via dotctl deploy -> ~/.config/teleia/config.toml.
#
# teleia speaks stdio JSON-RPC only; opencode's remote `context7` entry is
# replaced with the npx-published stdio build. `{env:VAR}` placeholders from
# opencode are dropped — teleia passes the parent env through to children, so
# CONTEXT7_API_KEY / GITHUB_PERSONAL_ACCESS_TOKEN / etc. are picked up
# automatically if exported in the shell.
#
# Note: teleia does no `~` / `$HOME` expansion in command/args, so the
# host-specific MCPs (filesystem root, hexstrike-ai venv, local mcp-server-git
# binary) are pinned to /home/fool/... — adjust if cloning to another box.

[mcps.context7]
command = "npx"
args    = ["-y", "@upstash/context7-mcp@4.0.4"]

[mcps.filesystem]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-filesystem@2026.8.31", "/home/fool"]

[mcps.github]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-github@2025.4.8"]

[mcps.fetch]
command = "npx"
args    = ["-y", "@tokenizin/mcp-npx-fetch@1.0.0"]

[mcps.hexstrike-ai]
command = "/home/fool/tools/hexstrike-ai/hexstrike-env/bin/python"
args    = [
    "/home/fool/tools/hexstrike-ai/hexstrike_mcp.py",
    "--server",
    "http://localhost:8888",
]

[mcps.playwright]
command = "npx"
args    = ["-y", "@playwright/mcp@0.0.80"]

[mcps.sequential-thinking]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-sequential-thinking@2026.8.31"]

[mcps.memory]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-memory@2026.8.31"]

[mcps.git]
command = "/home/fool/.local/bin/mcp-server-git"

[mcps.weather]
command = "opencode"
args    = ["x", "@h1deya/mcp-server-weather@0.1.3"]

