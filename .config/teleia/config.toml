# teleia config — MCP servers mirrored from ~/.config/opencode/opencode.json.
# Deployed via dotctl deploy -> ~/.config/teleia/config.toml.
#
# teleia speaks stdio JSON-RPC only; opencode's remote `context7` entry is
# replaced with the npx-published stdio build. `{env:VAR}` placeholders from
# opencode are dropped — teleia passes the parent env through to children, so
# CONTEXT7_API_KEY / GITHUB_PERSONAL_ACCESS_TOKEN / etc. are picked up
# automatically if exported in the shell.
#
# Note: teleia does no `~` / `$HOME` expansion in command/args, so the
# host-specific MCPs (filesystem root, hexstrike-ai venv) are pinned to /home/fool/... — adjust if cloning to another box.

[mcps.context7]
command = "npx"
args    = ["-y", "@upstash/context7-mcp@4.0.4"]

# teleia's credential scrub only drops LLM provider keys — it walks
# teleia_llm::PROVIDERS (ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / …)
# and nothing else. GITHUB_PERSONAL_ACCESS_TOKEN and CONTEXT7_API_KEY are not on
# that list, so as written every child inherited both — including `fetch`, an
# arbitrary-URL HTTP client, and `playwright`, a live browser. Blank them per
# server; `env` overrides the parent for that child only. [mcps.github] keeps the
# PAT because it is the one server that needs it, and [mcps.context7] keeps its
# own key for the same reason.
#
# The limit, not overstated: a hostile child runs as this same user and can read
# teleia's own /proc/<pid>/environ. This removes the accident, not the attacker.
[mcps.filesystem]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-filesystem@2026.8.31", "/home/fool"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

[mcps.github]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-github@2025.4.8"]

[mcps.fetch]
command = "npx"
args    = ["-y", "@tokenizin/mcp-npx-fetch@1.0.0"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

[mcps.hexstrike-ai]
command = "/home/fool/tools/hexstrike-ai/hexstrike-env/bin/python"
args    = [
    "/home/fool/tools/hexstrike-ai/hexstrike_mcp.py",
    "--server",
    "http://127.0.0.1:8888",
]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

[mcps.playwright]
command = "npx"
args    = ["-y", "@playwright/mcp@0.0.80"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

[mcps.sequential-thinking]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-sequential-thinking@2026.8.31"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

[mcps.memory]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-memory@2026.8.31"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

# No [mcps.git]. It named /home/fool/.local/bin/mcp-server-git, which does not
# exist and which nothing in this repo or on this machine creates — unlike the
# npx entries, whose command is a PATH lookup that installing node repairs.
# The path is not merely dead: ~/.local/bin is a directory `dotctl deploy` and
# every pip/npm --user install write into, so the entry stood as a reservation
# on a name any of them could later fill — and whatever landed there would be
# executed by an agent without anyone choosing it.

[mcps.weather]
command = "opencode"
args    = ["x", "@h1deya/mcp-server-weather@0.1.3"]
    env     = { GITHUB_PERSONAL_ACCESS_TOKEN = "", CONTEXT7_API_KEY = "" }

