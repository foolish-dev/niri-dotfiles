version: 2
updates:
  # Rust crate deps (clap, anyhow, tempfile, …). Cargo.lock is committed, so
  # these PRs bump the lockfile too.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # One PR per week for all crate bumps, not one per crate. These get taken
    # by hand often enough (cf. 7670625 "take the pending dep bumps") that a
    # per-crate queue just accumulates PRs that are already applied and have to
    # be closed as no-op diffs.
    groups:
      cargo:
        patterns: ["*"]

  # GitHub Actions in ci.yml (checkout, rust-cache, rust-toolchain) — keeps them
  # on supported runtimes so a Node-version deprecation can't break CI silently
  # (cf. the manual actions/checkout v4→v5 bump).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
