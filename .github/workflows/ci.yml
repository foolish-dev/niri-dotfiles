name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: the job only checks out and builds, never writes to the repo.
permissions:
  contents: read

jobs:
  rust:
    # Every push is built, not just main: a branch pushed without a PR used to
    # get no CI at all, so `main` was the first place its code was ever
    # compiled. The condition keeps that from double-running — a same-repo PR
    # is already covered by its branch's push event, so only fork PRs (which
    # have no push event here) need the pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed at
      # different code, a SHA cannot. Dependabot bumps a SHA and its version
      # comment together. rust-toolchain has no release tags -- its branch name
      # picks the toolchain, and this is the tip of `stable` -- so expect to
      # bump that one by hand; the Rust it installs is still current stable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets --locked
      # The self-rebuild, end to end on the binary just built: one rebuild with
      # the same arguments, no rebuild loop, only a warning under `install`.
      # Fake cargo and dotctl; nothing can reach install()'s real work.
      - run: tests/dotctl-selfupdate.sh target/debug/dotctl
      # Pure-Rust tests, tempfile the only dev-dep. Deliberately NOT gated
      # on `command -v pacman`: ubuntu-latest has none, and gating would mean
      # the distro-detection logic is never exercised anywhere but the
      # author's own box.
      - run: cargo test --locked

  shell:
    # Same condition as `rust`, for the same reason: a same-repo PR is already
    # covered by its branch's push event, so only fork PRs need the
    # pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, not the runner's copy: ubuntu-24.04 ships ShellCheck 0.9.0, which
      # flags trap-only cleanup functions as unreachable (SC2317) and
      # `cmd && var=1 || true` (SC2015) where 0.11.0 -- what Arch packages and
      # what these scripts are linted with locally -- flags neither. With the
      # runner's copy this step failed on every push from the day it was added.
      # The sha256 is GitHub's published digest for the release asset.
      # Dependabot cannot see this pin. When Arch's shellcheck moves past it,
      # bump both values together; this prints the pair for the latest release:
      #   gh api repos/koalaman/shellcheck/releases/latest --jq '.tag_name,
      #     (.assets[] | select(.name | endswith("linux.x86_64.tar.xz"))
      #      | .digest | ltrimstr("sha256:"))'
      - env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - run: shellcheck --version && shellcheck .local/bin/* tests/*.sh .config/tmux/scripts/*.sh
      # `hexstrike-assert-loopback` is the one script whose failure mode is an
      # unauthenticated command API left reachable, so its behaviour is pinned
      # rather than only linted. The suite is hermetic — a fake `ss` first on
      # PATH — so it needs no iproute2, opens no socket and never reaches
      # systemd.
      - run: tests/hexstrike-assert-loopback.sh
      # mkproj scaffolds into a directory the user names, and its failure mode
      # is deleting one they meant to keep. Hermetic: every case runs with
      # PROJ_DIR inside a mktemp -d, and the suite refuses to start otherwise.
      - run: tests/mkproj.sh
      # The tracked configs ARE the live desktop — ~/.config/* symlinks into
      # this repo — so a malformed one is a broken session, not a failed build.
      # Nothing else in CI opens any of them. json and tomllib are stdlib, so
      # this needs no install.
      # LuaJIT, not luac: neovim runs LuaJIT, and Lua 5.4/5.5 disagrees with it
      # on syntax in both directions — `local x = 1 //2` compiles under luac and
      # not under luajit. A checker that disagrees with the runtime is worse
      # than none. niri is not packaged for Ubuntu, so the KDL half skips here
      # and runs on the author's machine, which the suite says out loud.
      - run: command -v luajit >/dev/null || { sudo apt-get update && sudo apt-get install -y luajit; }
      # PyYAML is the one non-stdlib parser the suite wants, and the files it
      # checks include this one — a malformed workflow fails silently by simply
      # not running, which is the failure mode least likely to be noticed.
      - run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
      - run: tests/config-syntax.sh
      - run: tests/dotfiles-check.sh
      # The GitHub launcher holds a token for one moment: it must never start
      # the server without one, nor print it. Fakes for secret-tool and server.
      - run: tests/github-mcp.sh
      # The firmware notice must survive a login that beats the notification
      # server. The shipped notify() against a fake notify-send.
      - run: tests/fwupd-check.sh
      # The HexStrike Host guard against a real Flask, the version HexStrike's
      # venv runs. A venv because ubuntu's system Python is externally managed;
      # REQUIRE_FLASK so a failed install fails the step instead of skipping it.
      - run: |
          python3 -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install --quiet flask==3.0.3
          REQUIRE_FLASK=1 "$RUNNER_TEMP/guard-venv/bin/python" tests/hexstrike-host-guard.py
