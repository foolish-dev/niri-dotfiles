name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: the job only checks out and builds, never writes to the repo.
permissions:
  contents: read

jobs:
  rust:
    # Every push is built, not just main: a branch pushed without a PR used to
    # get no CI at all, so `main` was the first place its code was ever
    # compiled. The condition keeps that from double-running — a same-repo PR
    # is already covered by its branch's push event, so only fork PRs (which
    # have no push event here) need the pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets --locked
      # Pure-Rust tests, tempfile the only dev-dep. Deliberately NOT gated
      # on `command -v pacman`: ubuntu-latest has none, and gating would mean
      # the distro-detection logic is never exercised anywhere but the
      # author's own box.
      - run: cargo test --locked

  shell:
    # Same condition as `rust`, for the same reason: a same-repo PR is already
    # covered by its branch's push event, so only fork PRs need the
    # pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ShellCheck ships on the runner image today. Installing it when absent
      # costs one line and stops a green run from depending on that staying
      # true.
      - run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - run: shellcheck .local/bin/* tests/*.sh .config/tmux/scripts/*.sh
      # `hexstrike-assert-loopback` is the one script whose failure mode is an
      # unauthenticated command API left reachable, so its behaviour is pinned
      # rather than only linted. The suite is hermetic — a fake `ss` first on
      # PATH — so it needs no iproute2, opens no socket and never reaches
      # systemd.
      - run: tests/hexstrike-assert-loopback.sh
      # mkproj scaffolds into a directory the user names, and its failure mode
      # is deleting one they meant to keep. Hermetic: every case runs with
      # PROJ_DIR inside a mktemp -d, and the suite refuses to start otherwise.
      - run: tests/mkproj.sh
      # The tracked configs ARE the live desktop — ~/.config/* symlinks into
      # this repo — so a malformed one is a broken session, not a failed build.
      # Nothing else in CI opens any of them. json and tomllib are stdlib, so
      # this needs no install.
      - run: tests/config-syntax.sh
