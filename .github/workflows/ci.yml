name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: the job only checks out and builds, never writes to the repo.
permissions:
  contents: read

jobs:
  rust:
    # Every push is built, not just main: a branch pushed without a PR used to
    # get no CI at all, so `main` was the first place its code was ever
    # compiled. The condition keeps that from double-running — a same-repo PR
    # is already covered by its branch's push event, so only fork PRs (which
    # have no push event here) need the pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets --locked
      # 59 pure-Rust tests (only dev-dep is tempfile). Deliberately NOT
      # gated on `command -v pacman`: ubuntu-latest has none, and gating
      # would mean the distro-detection logic is never exercised anywhere
      # but the author's own box.
      - run: cargo test --locked
